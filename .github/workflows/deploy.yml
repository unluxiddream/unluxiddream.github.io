# GitHub Pages 자동 배포
# main 브랜치에 push 하면 사이트를 빌드해서 GitHub Pages에 올립니다.
# 사전 설정: 저장소 Settings → Pages → Source 를 「GitHub Actions」로 지정
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동으로 실행할 수도 있음
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 이전 배포를 기다리지 않고 최신 것만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        # with:
        #   node-version: 24   # 기본값 24 (Astro 7은 Node 22.23 이상 필요)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
